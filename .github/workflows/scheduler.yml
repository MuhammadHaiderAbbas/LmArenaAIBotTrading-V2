name: Scheduler

# External scheduler for the order matcher, breaker monitor, autopilot cycle and audit anchor.
# GitHub Actions cron has a 5-minute minimum, so paper-trading passes run every 5 minutes.
# The advisory lock in app.ops.worker prevents a tick from overlapping an API replica.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurex-scheduler
  cancel-in-progress: false

jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AUREX_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      AUREX_REDIS_URL: ${{ secrets.AUREX_REDIS_URL }}
      AUREX_AUDIT_ANCHOR_WEBHOOK_URL: ${{ secrets.AUREX_AUDIT_ANCHOR_WEBHOOK_URL }}
      AUREX_AUDIT_ANCHOR_WEBHOOK_SECRET: ${{ secrets.AUREX_AUDIT_ANCHOR_WEBHOOK_SECRET }}
      AUREX_ENVIRONMENT: production
      AUREX_EXTERNAL_SCHEDULER: "true"
      AUREX_BACKGROUND_WORKER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Wake Supabase if paused
        run: bash scripts/wake-supabase.sh
      - name: Run one scheduler tick
        working-directory: backend
        run: |
          if [[ -z "${AUREX_DATABASE_URL:-}" ]]; then
            echo "::notice::SUPABASE_DB_URL secret not set; scheduler tick skipped"
            exit 0
          fi
          python -m app.cli worker-once
      - name: Verify Edge API health
        run: bash scripts/supabase-health.sh
